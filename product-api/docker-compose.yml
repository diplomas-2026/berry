services:
  postgres:
    image: postgres:16
    container_name: berry-postgres
    environment:
      POSTGRES_DB: berry
      POSTGRES_USER: berry
      POSTGRES_PASSWORD: berry
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U berry -d berry"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: berry-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/berry
      DB_USER: berry
      DB_PASSWORD: berry
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
